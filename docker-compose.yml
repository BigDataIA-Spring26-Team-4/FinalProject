version: "3.8"

services:
  # ── FastAPI Backend ──
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - chromadb
    volumes:
      - ./src:/app/src
      - ./api:/app/api
    restart: unless-stopped

  # ── Streamlit Dashboard ──
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - fastapi
    volumes:
      - ./dashboard:/app/dashboard
    restart: unless-stopped

  # ── ChromaDB Vector Store ──
  chromadb:
    image: chromadb/chroma:0.5.0
    ports:
      - "8200:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # ── Airflow Webserver ──
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    command: webserver
    depends_on:
      - airflow-init
    restart: unless-stopped

  # ── Airflow Scheduler ──
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      - airflow-init
    restart: unless-stopped

  # ── Airflow Init (one-time DB setup) ──
  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin
               --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  # ── AIS Streaming Consumer ──
  ais-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:
  airflow_logs:
