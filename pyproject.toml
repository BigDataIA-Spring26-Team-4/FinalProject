[tool.poetry]
name = "maritime-sentinel"
version = "0.1.0"
description = "Global Maritime Supply Chain Resilience via Geopolitical Event Tracking and Agentic AI"
authors = ["Deep Prajapati", "Tapan Patel", "Seamus McAvoy"]
readme = "README.md"
packages = [{include = "maritime_sentinel", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Core
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
httpx = "^0.27"
structlog = "^24.4"

# Snowflake
snowflake-connector-python = {extras = ["pandas"], version = "^3.10"}

# Streaming
websockets = "^12.0"
aiohttp = "^3.9"

# LLM & Agents
langchain = "^0.2"
langchain-openai = "^0.1"
langchain-anthropic = "^0.1"
langgraph = "^0.2"
langsmith = "^0.1"
openai = "^1.30"
anthropic = "^0.28"

# Vector Store — chromadb-client is pure Python (no C++ build needed)
# Full chromadb runs inside Docker only
chromadb-client = "^0.5"

# Caching
redis = "^5.0"

# Geospatial & Trajectory
movingpandas = "^0.18"
geopandas = "^0.14"
shapely = "^2.0"

# Data Processing
pandas = "^2.2"
numpy = "^1.26"
pyarrow = "^16.0"

# API
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}

# Frontend
streamlit = "^1.35"
pygwalker = "^0.4"
plotly = "^5.22"
keplergl = "^0.3"

# GDELT
gdeltdoc = "^1.4"

# MCP
mcp = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"
mypy = "^1.10"
black = "^24.4"
pre-commit = "^3.7"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.14"
fakeredis = "^2.23"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
